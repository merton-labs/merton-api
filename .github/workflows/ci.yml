name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: merton-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name merton-api \
            -p 127.0.0.1:8080:8080 \
            -e APP_SECRET_KEY="$(openssl rand -base64 48)" \
            merton-api:ci
          trap 'docker logs merton-api || true; docker rm -f merton-api || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "merton-api did not become ready in time" >&2
              exit 1
            fi
            sleep 1
          done

          status="$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/v1/health)"
          test "$status" = "200"
          grep -q '"status":"ok"' /tmp/health.json
